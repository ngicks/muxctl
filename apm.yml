name: muxctl
version: 0.0.1
description: APM project for muxctl
author: ngicks
targets:
  - claude
  - codex
  - opencode
# User-scope units (base instructions, agents-simple-automation, ngcommit,
# ngplan) come from ngicks/agents-package/bundle/myenv via `apm install -g`,
# so this manifest lists only project-scope units.
dependencies:
  apm:
    - git: github.com/ngicks/agents-package
      path: bundle/go
    - git: github.com/ngicks/agents-package
      path: bundle/web-preact
    - git: github.com/ngicks/agents-package
      path: pkg/cc-workers
  mcp: []
scripts: {}
